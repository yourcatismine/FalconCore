# Player Collision Management
# If false, players cannot push each other. If true, vanilla player pushing applies.
enable-player-collisions: true

# Custom Join and Leave Messages & Sounds
join-leave:
  join:
    enabled: true
    message: "&8[&a+&8] &7{player}"
    sound:
      enabled: true
      name: "falcon.mama"
      volume: 1.0
      pitch: 1.0
  leave:
    enabled: true
    message: "&8[&c-&8] &7{player}"
    sound:
      enabled: false
      name: ""
      volume: 1.0
      pitch: 1.0

region:
  - "Asia"

motd:
  enabled: true
  motd: "FALCONCORE"

TOKEN: ""
ChannelID: ""

discord-status:
  interval-seconds: 30
  messages:
    - "Online: {playercount}"
    - "Total players: {totalplayers}"
    - "Banned: {bannedcount}"
    - "Muted: {mutecount}"

discord-webhooks:
  auction:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  orders:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  chat-log:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  death-log:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  join-leave:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  spawner:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"

database: #MysQL
  enabled: false
  host: "localhost"
  port: 3306
  database: ""
  username: ""
  password: ""

combat:
