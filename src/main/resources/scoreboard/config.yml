INTERVAL: 60
SCOREBOARD:
  ENABLED: true
  SHARD-BOOSTER: " &5⚡ &fBooster &5%falconcore_shard_booster%"
  VIP: "&fꜰᴀʟᴄᴏɴ+"
  SWITCHER:
    [
      " &#F97603☠ &fDeaths &#F97603%falconcore_deaths%",
      " &FC0000🗡 &fKills &#FC0000%falconcore_kills%",
    ]
  TEAMS: " &d🪓 &fTeam %team_name%"
  TITLE:
    - "&b&lFalconSMP"
  LINES:
    - ""
    - " &7{gamertag}"
    - " &a&l$ &fMoney &a%falconcore_balance%"
    - " &5⭐ &fShards &5%falconcore_shards%"
    - " {switcher}"
    - " &b☄ &fKeyall &b%falconcore_keyall%"
    - " &e⌚ &fPlaytime &e%falconcore_playtime%"
    - ""
    - " &7Asia (&b{region_ping}ms&7)"

# Duel Scoreboard (Active only when the player is in a Duel match)
# Supported Placeholders:
#   {opponent} / {kalaban}         - Opponent's username
#   {opponent_ping}                - Opponent's ping (ms)
#   {opponent_health}              - Opponent's health
#   {opponent_winrate}             - Opponent's historical win rate (e.g. 65.50%)
#   {win_chance} / {win_percentage}- Estimated win probability based on matchup (e.g. 58.2%)
#   {winrate}                      - Your own duel win rate
#   {duel_time} / {match_time}     - Match time remaining (mm:ss)
#   {time_elapsed}                 - Elapsed match time (mm:ss)
#   {arena}                        - Current duel arena
#   {streak}                       - Your win streak
#   {opponent_streak}              - Opponent's win streak
#   {gamertag}, {ping}, {region_ping}, {health}, {tps}, {mspt}, %falconcore_...%
DUEL:
  ENABLED: true
  TITLE:
    - "&#FF2A2A&lF&#FF4545&la&#FF6060&ll&#FF7B7B&lc&#FF9696&lo&#FFB1B1&ln&#FFCCCC&lSMP"
  LINES:
    - ""
    - " &c⚔ &c{opponent} &7(&c{opponent_ping}ms&7)"
    - " &7Win Chance &e{win_chance}"
    - " &7Opponent Winrate &a{opponent_winrate}"
    - " &7Your Winrate &d{winrate}"
    - ""
    - " &7Asia (&b{ping}ms&7) &f| &7Time &b{duel_time}"

CHAT-FORMAT:
  ENABLED: true
  CHAT: "&f%prefix%%player%&7: &f%message%"
  HOVER-LORE:
    - "%prefix%%player%"
    - "&7&m----------"
    - "&a$ &fMoney &a%falconcore_balance%"
    - "&c⚔ &fKills &c%falconcore_kills%"
    - "&e⌚ &fPlaytime &e%falconcore_playtime%"
    - "&5☠ &fDeaths &5%falconcore_deaths%"
    - "&5⭐ &fShards &5%falconcore_shards%"
    - "&7&m----------"
    - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴠɪᴇᴡ ѕᴛᴀᴛѕ"

# Available Custom Placeholders (works for target player being looked at):
# {ping}, {health}, {money}, {shards}, {playtime}, {kills}, {death}, {team}
NICKNAME-FORMAT:
  ENABLED: true
  FORMAT:
    - "{prefix}&7{gamertag}"
  # Note: BELOW-NAME requires exactly one numeric placeholder from the list above.
  BELOW-NAME:
    ENABLED: true
    TEXT: "&b{ping}ms &r| &a{money} $ &r| &5{shards} ⭐ &r| &d{team} 🪓"

TAB:
  ENABLED: true
  MAX_COLUMNS: 4
  MAX_ROWS: 20
  GROUP_SORTING:
    ENABLED: true
    RANKINGS:
      default: 1
  TITLE:
    header:
      - "&b&lFalconSMP"
      - "&f%online% players"
      - ""
    footer:
      - ""
      - "&7Tps:&b {tps}&7&l |&r&7 Mspt:&b {mspt}&7&l |&r&7 Ping:&b {ping}ms"